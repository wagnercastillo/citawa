services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: recep
      POSTGRES_PASSWORD: recep
      POSTGRES_DB: recepcionista
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql
volumes:
  pgdata: {}
